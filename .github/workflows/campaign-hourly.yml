# Zamanlanmış kampanyalar için ek tetikleyici (programı saatlik yazılı).
#
# Vercel'in Hobby planı iki cron ve yalnız günlük program veriyor; fazlasını
# isteyen bir `vercel.json` cron'u değil **deploy'u** düşürüyor (16-22 Eyl
# 2026 arası üretime hiçbir şey çıkmamasının sebebi buydu). Kampanya
# zamanlaması ise Vercel'in günde iki geçişinden daha sık bakılmak istiyor.
#
# Bu iş o boşluğu ücretsiz daraltıyor: GitHub Actions aynı uca vuruyor,
# Vercel'in kendi iki cron'u da yerinde duruyor. Yani:
#
#   · bu iş çalışırsa  → kampanya, zamanından sonraki ilk turda çıkar
#   · çalışmazsa       → `/api/cron/daily` 06:00 UTC ve ikinci geçiş 12:00 UTC
#                         yine alır; hiçbir kampanya kaybolmaz, yalnız gecikir
#
# "0 * * * *" saatte bir çalışmak DEMEK DEĞİL: GitHub zamanlanmış işleri
# garanti etmez, yoğunlukta erteler ve atlar. Ölçüm (22-23 Eyl 2026): turlar
# arası 2 ile 5,5 saat. Panel bu yüzden "genelde birkaç saat içinde" der.
# Saatlik hassasiyet gerekirse dış bir zamanlayıcı (cron-job.org, QStash)
# aynı uca `Authorization: Bearer <CRON_SECRET>` ile vurur ya da Vercel Pro
# cron'u kullanılır (docs/EMAIL-RESEND.md §7).
#
# KURULUM (tek seferlik, 22 Eyl 2026'da yapıldı): depo → Settings → Secrets
# and variables → Actions → `CRON_SECRET`, değeri Vercel'dekiyle **birebir
# aynı**. Secret tanımlı değilken iş kendini atlar; 503 alıp kırmızı yanmaz.

name: campaign-hourly
# Actions bu dosyayi listeye almamisti; yeniden taranmasi icin dokunuldu.

on:
  schedule:
    # Every 3 hours, not hourly (19 Oct 2026): each run is billed as a full
    # Actions minute and wakes the Neon compute, and GitHub skipped about
    # two of every three hourly runs anyway. Vercel's two daily passes stay.
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: campaign-hourly
  cancel-in-progress: false

jobs:
  ping:
    name: zamanlanmış kampanyaları yolla
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: /api/cron/campaign-emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET tanımlı değil — atlanıyor. Kurulum için bu dosyanın başına bakın."
            exit 0
          fi
          # --fail-with-body: uç 500 dönerse iş kırmızı yansın ve gövdesi
          # günlükte kalsın. Gövde satır saymaktan ibarettir, adres taşımaz.
          # KANONİK ad apex (laffogato.net): canonical, sitemap ve JSON-LD
          # @id'ler onu yayımlar. --location-trusted şart, --location değil:
          # 308 bir HATA DEĞİL (--fail-with-body yalnız 400+'ta kırılır, yani
          # yönlendirmeyi izlemeyen çağrı ucu HİÇ çağırmadan yeşil yanar) ve
          # düz --location cross-host yönlendirmede Authorization'ı DÜŞÜRÜR —
          # apex↔www arası 308'de secret yolda kalır, uç 401 der. İki host da
          # bizim; Vercel'de hangisi Production olursa olsun bu satır çalışır.
          curl --fail-with-body --silent --show-error --location-trusted \
               --max-time 300 --retry 2 --retry-delay 15 \
               -H "Authorization: Bearer $CRON_SECRET" \
               https://laffogato.net/api/cron/campaign-emails
