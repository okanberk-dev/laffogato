name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs of the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Dummy env so the build can resolve required vars without leaking secrets.
    # Real secrets live in Vercel; CI only proves the code compiles + builds.
    # NODE_ENV is intentionally NOT set — Next.js manages it itself during build.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # KANONİK alan adı olmak ZORUNDA, localhost değil: tests/structured-data
      # ve tests/campaign-emails JSON-LD @id'lerini ve e-posta bağlantılarını
      # bu değere göre bekler; localhost yazılırsa ikisi de kırılır.
      NEXT_PUBLIC_SITE_URL: https://laffogato.net
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      ADMIN_EMAIL: ci@laffogato.local
      ADMIN_PASSWORD: ci-placeholder-password
      ADMIN_SESSION_SECRET: ci-placeholder-session-secret-do-not-use-in-prod
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-placeholder-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Print toolchain
        run: |
          node --version
          npm --version
          echo "package-lock.json md5:"
          md5sum package-lock.json || true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
