name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs of the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    # A squash merge of a PR lands on main with "(#N)" in its title, and its
    # tree is the PR head that already passed here with main merged in (the
    # merge flow brings every branch up to date first). Running it again on
    # main cost a third of the account's free Actions minutes in Oct 2026
    # (the quota ran out on the 19th); a skipped job costs nothing. A direct
    # push to main, without "(#", is still checked.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway Postgres for tests/db-integration*.test.ts, which skip
    # without TEST_DATABASE_URL. It listens on 55432, NOT 5432: the dummy
    # DATABASE_URL below must stay unreachable, because the app applies its
    # migrations to whatever DATABASE_URL answers, and the unit tests and the
    # build are written for a site without a database (the same as before
    # this service existed).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: laf_it
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d laf_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Dummy env so the build can resolve required vars without leaking secrets.
    # Real secrets live in Vercel; CI only proves the code compiles + builds.
    # NODE_ENV is intentionally NOT set - Next.js manages it itself during build.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # KANONİK alan adı olmak ZORUNDA, localhost değil: tests/structured-data
      # ve tests/campaign-emails JSON-LD @id'lerini ve e-posta bağlantılarını
      # bu değere göre bekler; localhost yazılırsa ikisi de kırılır.
      NEXT_PUBLIC_SITE_URL: https://laffogato.net
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      ADMIN_EMAIL: ci@laffogato.local
      ADMIN_PASSWORD: ci-placeholder-password
      ADMIN_SESSION_SECRET: ci-placeholder-session-secret-do-not-use-in-prod
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-placeholder-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same major as Vercel (project setting nodeVersion 24.x) and as
      # package.json engines.node, which Vercel reads and which overrides the
      # project setting. Change all three together.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Print toolchain
        run: |
          node --version
          npm --version
          echo "package-lock.json md5:"
          md5sum package-lock.json || true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # A ratchet, not a free pass: the cap is today's count and only ever
      # goes down. The six warnings are eslint-config-next 16.3's new
      # no-location-assign-relative-destination rule on the hard
      # navigations out of the hash-routed SPA shell (chrome.tsx,
      # home-page.tsx x3, product-detail.tsx, site-chrome.tsx). Set it to 0
      # once they are resolved; a new warning anywhere fails the build now.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:55432/laf_it

      - name: Build
        run: npm run build
